spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/taskmanager}
    username: ${DATABASE_USERNAME:taskmanager}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  sandbox:
    seed-demo-data: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://51.195.82.237}
  jwt:
    secret: ${JWT_SECRET}

# Swagger / OpenAPI остаются доступны — нужны для курса Postman.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    itk.student.task.manager: INFO
