# demo.itklabs.online — task-manager (Spring Boot в контейнере app)
server {
    listen 443 ssl;
    http2 on;
    server_name demo.itklabs.online;

    ssl_certificate     /etc/letsencrypt/live/demo.itklabs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.itklabs.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name demo.itklabs.online;

    # Продление сертификата через webroot (контейнер certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
