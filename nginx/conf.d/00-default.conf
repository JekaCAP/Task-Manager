# Заглушка для запросов с неизвестным Host (сканеры, заход по IP).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/demo.itklabs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.itklabs.online/privkey.pem;

    return 444;
}
