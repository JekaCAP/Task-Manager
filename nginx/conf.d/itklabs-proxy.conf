# bot/resume/youtrack.itklabs.ru — прокси на внешний сервер (перенесено со старой VPS).
# Проверь, что сертификат bot.itklabs.ru покрывает SAN'ами resume и youtrack:
#   openssl x509 -in certbot/conf/live/bot.itklabs.ru/cert.pem -noout -text | grep DNS
server {
    listen 443 ssl;
    http2 on;
    server_name bot.itklabs.ru resume.itklabs.ru youtrack.itklabs.ru;

    ssl_certificate     /etc/letsencrypt/live/bot.itklabs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.itklabs.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass https://51.195.82.237;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Connection "";

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name bot.itklabs.ru resume.itklabs.ru youtrack.itklabs.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
