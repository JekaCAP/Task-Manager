stages: [test]

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  timeout: 15m
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    SELENIDE_HEADLESS: "true"
  cache:
    key: maven-hw
    paths:
      - .m2/repository
  before_script:
    - chmod +x ./mvnw
    - ./mvnw -B -ntp exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chrome"
  script:
    - chmod +x ./mvnw
    - ./mvnw -B -ntp test -Dtest='itk.student.task.manager.aqa.**'
  artifacts:
    when: always
    paths:
      - target/allure-results
    expire_in: 1 week