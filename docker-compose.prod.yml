# Production stack for VPS (HTTP, frontend + backend).
# Usage:
#   cp .env.prod.example .env.prod   # fill secrets on VPS
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Update backend only:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build app
#
# Update frontend (nginx + static):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build web

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - taskmanager_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmanager} -d ${POSTGRES_DB:-taskmanager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TASKMANAGER_BACKEND_IMAGE:-taskmanager-backend:latest}
    container_name: taskmanager-app
    restart: unless-stopped
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskmanager}
      DATABASE_USERNAME: ${POSTGRES_USER:-taskmanager}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://51.195.82.237}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - taskmanager

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${TASKMANAGER_WEB_IMAGE:-taskmanager-web:latest}
    container_name: taskmanager-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - taskmanager

volumes:
  taskmanager_pg_data:

networks:
  taskmanager:
    name: taskmanager-network
